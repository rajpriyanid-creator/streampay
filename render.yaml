services:
  - type: web
    name: streampay-access-service
    runtime: node
    plan: free
    rootDir: access-service
    buildCommand: (npm ci --include=dev || npm install --include=dev) && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: NETWORK
        value: monad-testnet
      - key: RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: SETTLEMENT_ADDRESS
        value: 0x3E016fa87f7149971F65Df413b667C5355c5B060
      - key: STREAM_IDS
        value: monad-keynote-hd,demo-stream,real-demo
      - key: DATA_STORE_DIR
        value: /tmp/streampay-data
      - key: CORS_ORIGIN
        value: https://streampay-frontend.onrender.com
      - key: TOKEN_SECRET
        generateValue: true

  - type: web
    name: streampay-frontend
    runtime: static
    buildCommand: (npm ci --legacy-peer-deps || npm install --legacy-peer-deps) && npm run build
    staticPublishPath: ./dist
    rootDir: frontend-zip
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_NETWORK
        value: testnet
      - key: VITE_STREAM_SIMULATION
        value: "false"
      - key: VITE_ACCESS_SERVICE_URL
        value: https://streampay-access-service.onrender.com
      - key: VITE_MONAD_TESTNET_RPC
        value: https://testnet-rpc.monad.xyz
      - key: VITE_SETTLEMENT_ADDRESS
        value: 0x3E016fa87f7149971F65Df413b667C5355c5B060

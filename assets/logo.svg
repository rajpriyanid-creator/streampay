<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background subtle radial ambient glow -->
    <radialGradient id="sp-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B041" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#836EF9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="sp-gold-primary" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#F5B041" />
      <stop offset="65%" stop-color="#D4831E" />
      <stop offset="100%" stop-color="#8E4F0B" />
    </linearGradient>

    <!-- Bevel & Shadow Metallic Gold -->
    <linearGradient id="sp-gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#B46513" />
      <stop offset="100%" stop-color="#451E03" />
    </linearGradient>

    <!-- Monad Purple Backing Rim -->
    <linearGradient id="sp-monad-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#836EF9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Electric Energy Core Stream -->
    <linearGradient id="sp-energy-core" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Glow Filter -->
    <filter id="sp-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="64" height="64" rx="16" fill="#0C0A08" />
  <circle cx="32" cy="32" r="28" fill="url(#sp-ambient)" />

  <!-- Outer Purple Edge Glow (Monad Ecosystem Accent) -->
  <path
    d="M 18,14 L 46,31 C 47.5,31.9 47.5,34.1 46,35 L 18,52 C 16.3,53 14,51.8 14,49.8 L 14,16.2 C 14,14.2 16.3,13 18,14 Z"
    stroke="url(#sp-monad-rim)"
    stroke-width="3"
    stroke-linejoin="round"
    opacity="0.75"
  />

  <!-- Play Prism Outer Body (Deep Gold Chamfer) -->
  <path
    d="M 19,15.5 L 45,31.2 C 46.2,31.9 46.2,33.7 45,34.4 L 19,50.1 C 17.7,50.9 16,49.9 16,48.3 L 16,17.3 C 16,15.7 17.7,14.7 19,15.5 Z"
    fill="url(#sp-gold-bevel)"
    stroke="url(#sp-gold-primary)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Interlocking Continuous 'S' Stream Ribbon -->
  <!-- Upper Loop -->
  <path
    d="M 28,19 C 32,14.5 40,15 44,20 C 47.5,24.5 45.5,30 40,32.5 L 33,35 C 28.5,37 26.5,41.5 28.5,45.5 C 30.5,49.5 36.5,50.5 41,47.5"
    fill="none"
    stroke="url(#sp-gold-primary)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner High-Velocity Micro-payment Energy Beam -->
  <path
    d="M 28,19 C 32,14.5 40,15 44,20 C 47.5,24.5 45.5,30 40,32.5 L 33,35 C 28.5,37 26.5,41.5 28.5,45.5 C 30.5,49.5 36.5,50.5 41,47.5"
    fill="none"
    stroke="url(#sp-energy-core)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sp-glow)"
  />

  <!-- Core Lightning Sparks / Micropayment Pulses -->
  <circle cx="36" cy="22" r="1.5" fill="#FFFFFF" filter="url(#sp-glow)" />
  <circle cx="34" cy="34" r="1.2" fill="#FFFFFF" filter="url(#sp-glow)" />
  <circle cx="33" cy="45" r="1.4" fill="#FFFFFF" filter="url(#sp-glow)" />

  <!-- Sharp Play Triangle Highlights -->
  <polygon points="17,17 17,49 21,46.5 21,19.5" fill="url(#sp-gold-primary)" opacity="0.9" />
</svg>

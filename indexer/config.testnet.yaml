# StreamPay v2.5 Envio HyperIndex Configuration — Monad Testnet
#
# NOT CONFIGURED: Do not use this config until a real StreamPaySettlement
# contract has been deployed to Monad Testnet (10143).
#
# After deployment, update:
#   1. The contract address below
#   2. The start_block to the deployment block number
#   3. Verify the contract code matches the expected ABI
#
name: streampay-indexer-testnet
description: StreamPay v2.5 Envio HyperIndex event indexer for Monad Testnet (Chain ID 10143)
networks:
  - id: 10143
    start_block: 70464119
    contracts:
      - name: StreamPaySettlement
        address:
          - "0x3E016fa87f7149971F65Df413b667C5355c5B060"
        handler: src/EventHandlers.ts
        events:
          - event: StreamOpened(bytes32 indexed sessionId, address indexed payer, address indexed recipient, address sessionSigner, bytes32 offerDigest, uint256 initialDeposit, uint64 validUntil, uint64 redemptionGraceSeconds, uint64 redemptionDeadline)
          - event: StreamPolicyBound(bytes32 indexed sessionId, bytes32 contentIdHash, bytes32 pricingPolicyHash, bytes32 manifestRoot, uint256 unitPrice, uint64 maxBillableUnits, uint64 maxLeadUnits, uint8 maxCreditSegments, uint64 maxCreditWindowUnits, uint256 maxUnredeemedAmount, uint64 offerExpiresAt)
          - event: StreamCheckpointed(bytes32 indexed sessionId, uint64 cumulativeUnits, uint256 cumulativeAmount, uint256 delta, uint256 totalSettled)
          - event: CloseRequested(bytes32 indexed sessionId, uint64 closeRequestedAt, uint64 challengeEndsAt)
          - event: StreamClosed(bytes32 indexed sessionId, uint256 totalPaidOrCredited, uint256 refundAllocated, uint8 closeReason)
          - event: PayoutCredited(address indexed token, address indexed account, uint256 amount, string reason)
          - event: Claimed(address indexed token, address indexed account, uint256 amount)
          - event: Paused(address account)
          - event: Unpaused(address account)

name: StreamPay CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Clean deterministic installs using lockfiles
      - name: Install Root Dependencies
        run: npm ci

      - name: Install Access Service Dependencies
        run: npm ci --prefix access-service

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend

      # TypeScript checks
      - name: TypeScript Check Access Service
        run: |
          cd access-service
          npx tsc --noEmit

      - name: TypeScript Check Frontend
        run: |
          cd frontend
          npx tsc --noEmit

      # Production builds
      - name: Build Access Service
        run: npm run build --prefix access-service

      - name: Build Frontend (Production)
        run: npm run build --prefix frontend

      # Foundry setup with pinned dependencies
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Foundry Dependencies
        run: |
          cd contracts
          forge install foundry-rs/forge-std --no-commit 2>/dev/null || true
          forge install OpenZeppelin/openzeppelin-contracts --no-commit 2>/dev/null || true

      - name: Build Smart Contracts
        run: |
          cd contracts
          forge build

      - name: Test Smart Contracts
        run: |
          cd contracts
          forge test -vvv

      # Manifest generation test
      - name: Generate Test Manifest
        run: node scripts/generate_manifest.js

      # Upload test artifacts
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            contracts/out/
            manifests/demo_stream.json
          retention-days: 7

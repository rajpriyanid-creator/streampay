name: StreamPay CI

on:
  push:
    branches: [ main, 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: Gitleaks Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test-and-build:
    name: Core Contracts, Services & E2E Lifecycle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Clean deterministic installs using lockfiles
      - name: Install Root Dependencies
        run: npm ci

      - name: Install Access Service Dependencies
        run: npm ci --prefix access-service

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend-zip

      # TypeScript checks
      - name: TypeScript Check Access Service
        run: |
          cd access-service
          npx tsc --noEmit

      - name: TypeScript Check Frontend
        run: |
          cd frontend-zip
          npx tsc --noEmit

      # Production builds
      - name: Build Access Service
        run: npm run build --prefix access-service

      - name: Build Frontend (Production)
        run: npm run build --prefix frontend-zip

      # Unit Tests
      - name: Run Frontend Protocol Unit Tests
        run: npm test --prefix frontend-zip

      # Generate canonical manifest
      - name: Generate Canonical Merkle Manifest
        run: node scripts/generate_manifest.js

      # Reservation Ledger Unit & Concurrency Tests
      - name: Run Reservation Ledger Tests
        run: node --test access-service/dist/reservationStore.test.js

      # Foundry setup with pinned dependencies
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Foundry Dependencies
        run: |
          cd contracts
          forge install foundry-rs/forge-std --no-commit 2>/dev/null || true
          forge install OpenZeppelin/openzeppelin-contracts --no-commit 2>/dev/null || true

      - name: Build Smart Contracts
        run: |
          cd contracts
          forge build || {
            ERR=$(forge build 2>&1)
            echo "::error::Forge build failed: $ERR"
            exit 1
          }

      - name: Test Smart Contracts
        run: |
          cd contracts
          forge test -vvv || {
            ERR=$(forge test -vvv 2>&1 | tail -n 50)
            echo "::error::Forge test failed: $ERR"
            exit 1
          }

      # Local Chain Lifecycle Test
      - name: Run Local Chain Lifecycle Test
        run: |
          echo "Starting Anvil on port 8545..."
          anvil --chain-id 31337 --port 8545 &
          ANVIL_PID=$!
          sleep 3

          cd contracts
          # Public Anvil test key. Never use on a real network.
          DEPLOY_OUT=$(forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 2>&1)
          echo "$DEPLOY_OUT"
          cd ..
          SETTLEMENT=$(node -e "try { console.log(require('./contracts/deployment.json').settlementContract); } catch(e) { process.exit(1); }")
          TOKEN=$(node -e "try { console.log(require('./contracts/deployment.json').paymentToken.address); } catch(e) { process.exit(1); }")
          cp contracts/deployment.json manifests/local.json 2>/dev/null || true

          if [ -z "$SETTLEMENT" ]; then
            echo "Failed to extract settlement address from deployment output"
            kill $ANVIL_PID || true
            exit 1
          fi

          echo "Settlement: $SETTLEMENT, Token: $TOKEN"

          echo "Executing on-chain complete lifecycle test (open -> checkpoint -> continued playback -> close/refund)..."
          SETTLEMENT_ADDRESS=$SETTLEMENT TOKEN_ADDRESS=$TOKEN npx tsx scripts/e2e/lifecycle-test.ts > /tmp/lifecycle.log 2>&1 || {
            ERR=$(tail -n 20 /tmp/lifecycle.log | tr '\n' ' ')
            echo "::error::lifecycle-test.ts failed: $ERR"
            cat /tmp/lifecycle.log
            kill $ANVIL_PID || true
            exit 1
          }
          cat /tmp/lifecycle.log

          echo "Starting Access Service connected to local chain..."
          PORT=4001 RPC_URL=http://127.0.0.1:8545 SETTLEMENT_ADDRESS=$SETTLEMENT NETWORK=local ENABLE_TEST_CLOCK=true node access-service/dist/server.js > /tmp/svc.log 2>&1 &
          SVC_PID=$!
          sleep 3

          echo "Running HTTP E2E Test Suite..."
          ACCESS_URL=http://localhost:4001 node scripts/e2e/e2e.mjs > /tmp/e2e.log 2>&1 || {
            ERR=$(tail -n 20 /tmp/e2e.log | tr '\n' ' ')
            echo "::error::e2e.mjs failed: $ERR"
            cat /tmp/e2e.log
            cat /tmp/svc.log
            kill $SVC_PID || true
            kill $ANVIL_PID || true
            exit 1
          }
          cat /tmp/e2e.log

          echo "Running Access Service End-to-End Integration Suite (media hashes, proofs, gating, checkpoints)..."
          ACCESS_URL=http://localhost:4001 RPC_URL=http://127.0.0.1:8545 SETTLEMENT_ADDRESS=$SETTLEMENT TOKEN_ADDRESS=$TOKEN npx tsx scripts/e2e/access-service-integration.ts > /tmp/integ.log 2>&1 || {
            ERR=$(tail -n 20 /tmp/integ.log | tr '\n' ' ')
            echo "::error::access-service-integration.ts failed: $ERR"
            cat /tmp/integ.log
            cat /tmp/svc.log
            kill $SVC_PID || true
            kill $ANVIL_PID || true
            exit 1
          }
          cat /tmp/integ.log

          echo "Running Fragment Loader Injected Corruption & Merkle Verification Suite..."
          npx tsx scripts/e2e/fragment-loader-corruption.test.ts

          kill $SVC_PID || true
          kill $ANVIL_PID || true

          echo "Running Offline Simulation Mode Integration Suite (No Anvil / No Contract)..."
          npx tsx scripts/e2e/simulation-mode.test.ts

          echo "Running Durable Persistence, Restart Recovery & Dual-Instance Suite..."
          npx tsx scripts/e2e/durable-persistence.test.ts

          echo "Running Testnet Signing Safety & EIP-712 Verification Suite..."
          npx tsx scripts/e2e/testnet-signing-safety.test.ts

          echo "Running Failure Demo Script..."
          npx tsx scripts/failure-demo.ts

      # Active frontend smoke check
      - name: Run Vite Frontend Smoke Check
        run: |
          npm run dev --prefix frontend-zip -- --host 127.0.0.1 --port 3000 > /tmp/frontend.log 2>&1 &
          FE_PID=$!
          sleep 5
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/frontend.html
          grep -q "StreamPay" /tmp/frontend.html
          kill $FE_PID || true

      # Upload test artifacts
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            contracts/out/
            manifests/demo_stream.json
          retention-days: 7

  envio-indexer:
    name: Envio Indexer Codegen & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build Contracts for ABI
        run: |
          cd contracts
          forge install foundry-rs/forge-std --no-commit 2>/dev/null || true
          forge install OpenZeppelin/openzeppelin-contracts --no-commit 2>/dev/null || true
          forge build
          cd ..
          mkdir -p indexer/abis
          node -e "const fs = require('fs'); const artifact = JSON.parse(fs.readFileSync('contracts/out/StreamPaySettlement.sol/StreamPaySettlement.json', 'utf8')); fs.writeFileSync('indexer/abis/StreamPaySettlement.json', JSON.stringify(artifact.abi, null, 2));"

      - name: Install Indexer Dependencies
        run: |
          cd indexer
          pnpm install || npm install

      - name: Run Envio codegen and build
        run: |
          cd indexer
          pnpm run build
